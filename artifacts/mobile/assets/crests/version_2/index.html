const groups = {};
for (const f of files) { const [dir] = f.split('/'); (groups[dir] = groups[dir] || []).push(f); }
for (const dir of Object.keys(groups)) {
  const h = document.createElement('h2'); h.textContent = dir; root.appendChild(h);
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const f of groups[dir]) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const img = document.createElement('img'); img.src = f; img.alt = f; img.loading = 'lazy';
    const label = document.createElement('span'); label.textContent = f.split('/')[1].replace('.png','');
    cell.append(img, label); grid.appendChild(cell);
  }
  root.appendChild(grid);
}
